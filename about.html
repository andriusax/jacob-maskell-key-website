---
layout: default
title: About
permalink: /about/
---
<section class="page-header">
  <h1 class="hero-display">About</h1>
</section>

<section class="about-bio">
  <div class="about-bio__media">
    <img src="{{ '/assets/images/jacob-gif-placeholder.gif' | relative_url }}" alt="Jacob Maskell-Key">
  </div>

  <div class="about-bio__text">
    {{ site.data.about.bio | markdownify }}
  </div>
</section>

<script>
  (function () {
    // Bio links come from Markdown, which has no target/rel syntax,
    // so force them all to open in a new tab.
    document.querySelectorAll('.about-bio__text a').forEach(function (a) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
  })();

  (function () {
    if (!window.matchMedia('(max-width: 760px)').matches) return;

    var paragraphs = document.querySelectorAll('.about-bio__text p');

    if (!('IntersectionObserver' in window)) {
      paragraphs.forEach(function (p) { p.classList.add('is-visible'); });
      return;
    }

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    paragraphs.forEach(function (p) { observer.observe(p); });
  })();
</script>
