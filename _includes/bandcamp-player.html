<script>
  // Listen button on a card: swap it for an inline Bandcamp or Spotify player.
  // The player is only created on click, so the page doesn't load 20 iframes up front.
  (function () {
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.album-card.has-player .listen-btn');
      if (!btn) return;
      e.preventDefault();
      var card = btn.closest('.album-card');
      var slot = card.querySelector('.album-card__player');
      if (!slot.firstChild) {
        var type = card.dataset.bcType, id = card.dataset.bcId;
        var frame = document.createElement('iframe');
        if (type.indexOf('spotify-') === 0) {
          frame.src = 'https://open.spotify.com/embed/' + type.slice(8) + '/' + id + '?utm_source=generator';
          frame.title = 'Spotify player';
          frame.style.height = '152px';
          frame.style.borderRadius = '12px';
          frame.setAttribute('allow', 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture');
        } else {
          frame.src = 'https://bandcamp.com/EmbeddedPlayer/' + type + '=' + id +
            '/size=large/bgcol=ffffff/linkcol=000831/tracklist=false/artwork=none/transparent=true/';
          frame.title = 'Bandcamp player';
          frame.setAttribute('seamless', '');
          frame.setAttribute('allow', 'autoplay');
        }
        slot.appendChild(frame);
      }
      card.classList.add('is-playing');
    });
  })();
</script>
