---
layout: default
title: Contact
permalink: /contact/
---
<section class="page-header">
  <h1 class="hero-display">Contact</h1>
</section>

<form class="contact-form" action="https://formsubmit.co/jacobmaskellkey@gmail.com" method="POST">
  <input type="hidden" name="_next" value="{{ '/thank-you/' | absolute_url }}">
  <input type="hidden" name="_subject" value="New message from jacobmaskell-key.com">
  <input type="hidden" name="_captcha" value="false">
  <div class="form-field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="your@email.com" required>
  </div>
  <div class="form-field">
    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" placeholder="Subject" required>
  </div>
  <div class="form-field">
    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Message" required></textarea>
  </div>
  <button type="submit" class="send-btn" aria-label="Send message">
    <span class="send-btn__icon"><i class="fa-solid fa-paper-plane"></i></span>
    <span class="send-btn__label">Send</span>
  </button>
</form>
