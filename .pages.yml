media:
  - name: images
    label: Images
    input: assets/images/uploads
    output: /assets/images/uploads
    rename: safe
    extensions: [png, jpg, jpeg, gif, webp]

content:
  - name: about
    label: About
    type: file
    path: _data/about.yml
    format: yaml
    fields:
      - name: bio
        label: Bio
        type: rich-text
        description: "Select a word or phrase and use the link button in the toolbar to turn it into a hyperlink. Links always open in a new tab automatically."
        options:
          format: markdown

  - name: discography
    label: Discography
    type: file
    path: _data/discography.yml
    format: yaml
    list: true
    fields:
      - { name: band, type: string }
      - { name: album, type: string }
      - { name: label, type: string, label: "Record Label" }
      - { name: year, type: string }
      - { name: image, type: image }
      - { name: link, type: string, label: "Listen Link" }

  - name: remixes
    label: Remixes
    type: file
    path: _data/remixes.yml
    format: yaml
    list: true
    fields:
      - { name: band, type: string }
      - { name: album, type: string }
      - { name: label, type: string, label: "Record Label" }
      - { name: year, type: string }
      - { name: image, type: image }
      - { name: link, type: string, label: "Listen Link" }

  - name: gigs
    label: Gigs
    type: file
    path: _data/gigs.yml
    format: yaml
    list: true
    fields:
      - name: date
        type: date
        label: "Gig Date"
        description: "Upcoming/Past is worked out automatically from this date — no need to set it manually."
        default: ""
        options:
          format: yyyy-MM-dd
      - { name: city, type: string }
      - { name: venue, type: string }
      - { name: project, type: string }
      - { name: link, type: string, label: "Ticket Link" }

  - name: music_videos
    label: Watch (Music Videos)
    type: file
    path: _data/music_videos.yml
    format: yaml
    list: true
    fields:
      - { name: title, type: string }
      - { name: youtube_id, type: string, label: "YouTube ID", description: "The part after watch?v= in the YouTube URL" }
      - { name: description, type: text }
      - name: credits
        type: string
        label: "Credits"
        description: "One line per credit, e.g. Composition: Jacob Maskell-Key"
        options:
          list: true

  - name: commisions
    label: Commissions
    type: file
    path: _data/commisions.yml
    format: yaml
    list: true
    fields:
      - { name: title, type: string }
      - { name: youtube_id, type: string, label: "YouTube ID", description: "The part after watch?v= in the YouTube URL" }
      - { name: description, type: text }
      - name: credits
        type: string
        label: "Credits"
        description: "One line per credit, e.g. Composition: Jacob Maskell-Key"
        options:
          list: true

  - name: press
    label: Press
    type: file
    path: _data/press.yml
    format: yaml
    list: true
    fields:
      - { name: publication, type: string }
      - { name: title, type: string }
      - { name: url, type: string }

  - name: live_projects
    label: Live Projects
    type: file
    path: _data/live_projects.yml
    format: yaml
    list: true
    fields:
      - { name: name, type: string, label: "Project Name" }
      - { name: image, type: image }
      - { name: link, type: string, label: "Link" }
