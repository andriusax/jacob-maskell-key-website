media:
  - name: images
    label: Images
    input: assets/images/uploads
    output: /assets/images/uploads
    rename: safe
    extensions: [png, jpg, jpeg, gif, webp]

content:
  - name: home
    label: Home Page
    type: file
    path: _data/home.yml
    format: yaml
    fields:
      - { name: peek_head, type: boolean, label: "Peeking head on the other pages", description: "On: now and then (at most once per visit), Jacob's head peeks in from the side of the screen on pages other than the homepage and About. Clicking it makes it go away for 3 days.", default: true }
      - { name: eyes_follow_cursor, type: boolean, label: "Eyes follow the cursor", description: "On: the left hero photo's eyes follow the cursor. This only works with the current photo of Jacob, so turn it off if you change the Left Hero Media.", default: true }
      - { name: hero_left, type: image, label: "Left Hero Media (gif or image)" }
      - { name: animate_hero_left, type: boolean, label: "Left photo: play animation", description: "On: the Left Hero Media gif plays. Off: it stays still on its first frame — the eyes still follow the cursor and blink. Only applies while 'Eyes follow the cursor' is on.", default: true }
      - { name: hero_right, type: image, label: "Right Hero Media (gif or image)" }
      - { name: hero_right_carousel, type: boolean, label: "Right Hero: Discography Carousel", description: "On: cycles through all Discography covers (links to the Discography page). Off: shows the Right Hero Media image instead.", default: true }
      - { name: show_upcoming_gigs, type: boolean, label: "Show Upcoming Gigs", description: "On: shows your next 3 upcoming gigs (from the Gigs page) under the hero images. Hides automatically when nothing is coming up.", default: true }

  - name: about
    label: About
    type: file
    path: _data/about.yml
    format: yaml
    fields:
      - name: bio
        label: Bio
        type: rich-text
        description: "Select a word or phrase and use the link button in the toolbar to turn it into a hyperlink. Links always open in a new tab automatically."
        options:
          format: markdown

  - name: discography
    label: Discography
    type: file
    path: _data/discography.yml
    format: yaml
    list: true
    fields:
      - { name: band, type: string }
      - { name: album, type: string }
      - { name: label, type: string, label: "Record Label" }
      - { name: year, type: string }
      - { name: image, type: image }
      - { name: link, type: string, label: "Listen Link" }

  - name: remixes
    label: Remixes
    type: file
    path: _data/remixes.yml
    format: yaml
    list: true
    fields:
      - { name: band, type: string }
      - { name: album, type: string }
      - { name: label, type: string, label: "Record Label" }
      - { name: year, type: string }
      - { name: image, type: image }
      - { name: link, type: string, label: "Listen Link" }

  - name: gigs
    label: Gigs
    type: file
    path: _data/gigs.yml
    format: yaml
    list: true
    fields:
      - name: date
        type: date
        label: "Gig Date"
        description: "Upcoming/Past is worked out automatically from this date — no need to set it manually."
        default: ""
        options:
          format: yyyy-MM-dd
      - { name: city, type: string }
      - { name: venue, type: string }
      - { name: project, type: string }
      - { name: link, type: string, label: "Ticket Link" }

  - name: events
    label: Events (posters)
    type: file
    path: _data/events.yml
    format: yaml
    list: true
    fields:
      - { name: title, type: string, label: "Event name" }
      - name: date
        type: date
        label: "Date"
        description: "The Events page is sorted by this date, newest first."
        options:
          format: yyyy-MM-dd
      - { name: venue, type: string, label: "Venue" }
      - { name: image, type: image, label: "Poster", description: "Events without a poster don't show on the page." }
      - { name: link, type: string, label: "Link (optional)", description: "Tickets, RA or Instagram page. Clicking the poster opens it." }

  - name: music_videos
    label: Direction (Music Videos)
    type: file
    path: _data/music_videos.yml
    format: yaml
    list: true
    fields:
      - { name: title, type: string }
      - { name: youtube_id, type: string, label: "YouTube ID", description: "The part after watch?v= in the YouTube URL" }
      - { name: description, type: text }
      - name: credits
        type: string
        label: "Credits"
        description: "One line per credit, e.g. Composition: Jacob Maskell-Key"
        list: true

  - name: commisions
    label: Commissions
    type: file
    path: _data/commisions.yml
    format: yaml
    list: true
    fields:
      - { name: title, type: string }
      - { name: youtube_id, type: string, label: "YouTube ID", description: "The part after watch?v= in the YouTube URL" }
      - { name: description, type: text }
      - name: credits
        type: string
        label: "Credits"
        description: "One line per credit, e.g. Composition: Jacob Maskell-Key"
        list: true

  - name: press
    label: Press
    type: file
    path: _data/press.yml
    format: yaml
    list: true
    fields:
      - { name: publication, type: string }
      - { name: title, type: string }
      - { name: url, type: string }

  - name: live_projects
    label: Live Projects
    type: file
    path: _data/live_projects.yml
    format: yaml
    list: true
    fields:
      - { name: name, type: string, label: "Project Name" }
      - { name: image, type: image }
      - name: description
        label: Description
        type: rich-text
        description: "Shown on the project's own page. Select text and use the link button to add a hyperlink."
        options:
          format: markdown
      - { name: video, type: string, label: "YouTube Video", description: "Paste the normal YouTube link. It's embedded on the project's page." }
      - { name: link, type: string, label: "Extra Link (optional)", description: "Shown as a 'More from…' link on the project's page, e.g. Instagram or Bandcamp." }
      - name: gig_names
        type: string
        label: "Gig names (optional)"
        description: "Gigs whose Project starts with this project's name show up on its page automatically. Only fill this in if the gigs use a different name, e.g. 'Dis Fig' for Dis Fig x Spooky-J."
        list: true
