bio: |
  Jacob Maskell-Key is a multi-disciplined musician based in Amsterdam, Netherlands. He is the founder of the band [Nihiloxica](https://nihiloxica.bandcamp.com/album/source-of-denial) ([Nyege Nyege Tapes](https://nyegenyegetapes.bandcamp.com/album/nihiloxica), [Crammed Discs](http://www.crammed.be/)) and produces under the alias Spooky-J with releases on Blip Discs, [Rocket Recordings](https://rocketrecordings.com/) and his own label [Spooky Shit](https://spookyshit.bandcamp.com/).

  Growing up in China, he studied Jazz drumming at JZ School in Shanghai going on to graduate with a BA (Hons) in Music at Leeds College of Music. Getting involved in the vibrant club scene he started to develop an interaction with his instrumental background and electronic productions through [Capua Collective](https://www.youtube.com/watch?v=e95qeFGrLQQ) and [Blip Discs](https://www.theransomnote.com/music/premieres/video-premiere-watch-spooky-j-jam/), leading to a residency with Nyege Tapes in Uganda.

  Since moving to Amsterdam in 2018, Jacob has been a regular participant in the improvised, jazz and electronic scenes playing in projects locally and internationally with [Dis Fig](https://roadburn.com/band/dis-fig-live-feat-spooky-j/), [AWICHAS](https://www.youtube.com/watch?v=MfVCfqLtyhA), and [Ronald Langestraat](https://ra.co/events/2125130) as well as starting the label Sundried Understandings releasing the first record with his project [Band Photo](https://sundriedunderstandings.bandcamp.com/album/jessica-album). Following a recent collaboration with [Marc Hollander](https://en.wikipedia.org/wiki/Marc_Hollander), Jacob appears as the drummer on the upcoming album from the influential avant-rock group [Aksak Maboul](https://aksakmaboul.bandcamp.com/).
