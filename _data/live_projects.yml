- name: Spooky-J
  image: /assets/images/uploads/spooky-j-cover-2464x1463.jpg
  description: The British electronic architect behind Nihiloxica’s rhythmic
    force, Spooky-J is the alter ego of drummer and producer Jacob Maskell-Key,
    who dives deep into the realms of solo drumming and effects processing for
    his performances. With roots in Amsterdam's vibrant improv scene, he evolved
    his sound by merging live effects manipulation and drum triggers to craft
    intense, doom-laden dance soundscapes. His signature style is a fierce blend
    of rhythm and experimentation, designed to ignite sweat-drenched dance
    floors.
  link: https://www.instagram.com/reels/C48HvadsFDU/
- name: Nihiloxica
  image: /assets/images/uploads/whatsapp-image-2026-10-17-at-103015.jpeg
  description: "Treading a fine (and erratic) line between traditional Bugandan
    drum music, industrial post-punk, and club-ready rave music, Nihiloxica are
    a group like no other. It is the outcome of a collaboration between Ugandan
    drummers Henry Isabirye, Henry Kasoma, and Jamiru Mwanje, UK-based producer
    Pete Jones (pq), and the Amsterdam-based producer Jacob Maskell-Key
    (Spooky-J). Their self-titled debut EP released with Nyege Nyege Tapes in
    2017 to widespread critical acclaim, leading to a debut performance as
    headliners at Nyege Nyege Festival that year. Guiding listeners into a
    trance, their more-than-techno sounds create hypnotic pathways into altered
    states. Dark techno ambience is ruptured by booming percussion, and
    traditional Engalabi and Bakisimba drums meld with synthesisers and
    electronics in Nihiloxica's otherworldly music. "
  video: https://www.youtube.com/watch?v=tIO3uxKiB5I&t=8s
- name: AWICHAS
  image: /assets/images/uploads/rewire202604122143-awichas-sabine-van-nistelrooij3000.jpg
  description: "**AWICHAS** is a music project initiated by Bolivian/Brazilian
    multi-medium artist and performer Ibelisse Guardia Ferragutti. The project
    is inspired by Andean ritual and microtonal music. In collaboration with
    sound artist Jochem van Tol, this has been translated to trance-inducing
    electronic tonalities. The band’s music is a testament of appreciation to
    the undermined and neglected voices of the Andes, who do not forget or
    abandon their sonic heritage. Where subversive memories of the mountain’s
    overground and repetitive rhythms from Frank Rosaly and Jacob Maskell-Key
    meet, melt, and converse with the underground echoes of the city’s nightly
    club music. Accompanied by singer Julia Werner and synths by Lida
    Brouskari."
  video: https://www.youtube.com/watch?v=KFOdheuCRuU
- name: Band Photo
  image: /assets/images/uploads/whatsapp-2026-10-14-2464x1463.jpg
  description: Band Photo is James McClure (Trumpet) Jack Beattie (Sampler), and
    Jacob Maskell-Key (Drums). Their performances unfold within a living echo
    chamber, sculpting ghostly atmospheres and searing drones out of themselves.
    In deliberate opposition to the hyper-sped consumption of contemporary
    media, Band Photo focuses on vulnerability, openness, and deep listening,
    creating an environment that invites introspection and sustained attention.
  video: https://www.youtube.com/watch?v=0SsVyjRL7BY&list=PLnfEGuCi6vW01WUdW5a5LQjNI5yOBVHvc
- name: Dis Fig x Spooky-J
  image: /assets/images/uploads/26ctm2025byfrankiecasillo1200.jpg
  description: "Using her acrobatic voice and physical presence to transmit
    emotional complexity from a pit deeper than language, Dis Fig dredges forth
    a cathartic distillate that oozes between vulnerable beauty and retching
    chaos. "
  link: https://www.instagram.com/p/DTBE-iXDc7K/?utm_source=ig_web_copy_link&cplk=MzRlODBiNWFlZA==&srtk=MzRlODBiNWFlZA==
  gig_names:
    - Dis Fig
- name: Hot In Da Club
  image: /assets/images/uploads/spooky-selfie-2464x1463.jpg
  description: "Hot In Da Club is the sweat-core trio of Spooky-J, pq and Ekhe who
    are all conveniently friends and run the label Spooky Shit in creative
    harmony.  "
  link: https://spookyshit.bandcamp.com/album/avant-harde
- name: Toni Geitani + Marmoucha Orchestra
  image: /assets/images/uploads/images.jpeg
  description: >-
    Marmoucha Orchestra presents *Wahj* , a new live performance based on the
    new album of the same name by project leader Toni Geitani. For this tour,
    Geitani and other members of Marmoucha Orchestra are developing arrangements
    that reimagine the album for a compact, flexible lineup of six musicians.


    Sung in classical Arabic (fuṣḥā) and rooted in maqām traditions, *Wahj*
    moves between experimental electronics, ambient, and contemporary Arabic
    soundscapes. In the live version, the Marmoucha Orchestra deepens these
    materials into an immersive, audiovisual performance in which
    instrumentation, electronics, and lighting effects continuously interact.
  video: https://www.youtube.com/shorts/yCx2GHTEa1w
- name: Ronald Langestraat
  image: /assets/images/uploads/dscf253235.jpg
  description: After making a name for himself in the late 70’s Amsterdam jazz
    scene playing with Cascada and Ritmo Natural, keyboardist Ronald Langstraat
    began seeking his own musical curiosities and inspirations. Langstraat
    crowded his living room with electric and acoustic pianos, a Moog
    synthesizer, organs, drums, clarinets, saxophones, and started to record his
    dreamy compositions on a 4 track tape recorder. When he shared his work with
    his bandmates, they ridiculed him to the point where he wrote the song “You
    Need to Cry”, while wallowing in his loneliness. The music was left
    unreleased until just a few years ago in 2019, when Lagstraat was 79.
    Searching is filled with favorites but a few must-mentions include A2 In the
    Middle of the Night, an upbeat tune with brilliant piano and synth melodies
    that layer to create a stunning sonic landscape, and B1 I’m Ready For
    Dancing, which features a four-to-the-floor dance beat and perfectly
    captures the mood of the quote provided by label South of North
  video: https://www.youtube.com/watch?v=VTJhuIpd74Y
