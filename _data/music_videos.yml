- title: Nihiloxica - Kadodi (Official Music Video)
  youtube_id: PGAQgVjweWM
  description: The official music video for Kadodi, taken from Nihiloxica's self
    titled EP released on Nyege Nyege Tapes in December 2017 . The Kadodi rhythm
    traditionally accompanies the East Ugandan Imbalu circumcision ritual, and
    this traumatic yet powerful experience feeds the ferocity of the music.
  credits:
    - "Composition: Nihiloxica"
    - "Editor: Jacob Maskell-Key"
    - "Camera: Grace Holyoake-Ward"
