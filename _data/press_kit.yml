projects:
  - name: Spooky-J
    bio_short: >-
      Jacob Maskell-Key is a multi-disciplined musician based in Amsterdam. He is
      the founder of the band Nihiloxica (Nyege Nyege Tapes, Crammed Discs) and
      produces under the alias Spooky-J, with releases on Blip Discs, Rocket
      Recordings and his own label Spooky Shit.
    bio_long: ""
  - name: Nihiloxica
    bio_short: >-
      Nihiloxica is a band formed in Kampala, Uganda, bringing together members
      of the Nilotika Cultural Ensemble on Bugandan drums with Spooky-J (drum
      kit) and pq (electronics). Releases on Nyege Nyege Tapes and Crammed Discs.
    bio_long: ""
