intro: Riders, photos, bios and logos for promoters, venues and press. Anything
  missing? Get in touch.
projects:
  - name: Spooky-J
    bio_short: Spooky-J is the alter ego of drummer and producer Jacob Maskell-Key,
      who dives deep into the realms of solo drumming and effects processing for
      his performances. His signature style is a fierce blend of rhythm and
      experimentation, designed to ignite sweat-drenched dance floors.
    bio_long: The British electronic architect behind Nihiloxica’s rhythmic force,
      Spooky-J is the alter ego of drummer and producer Jacob Maskell-Key, who
      dives deep into the realms of solo drumming and effects processing for his
      performances. With roots in Amsterdam’s vibrant improv scene, he evolved
      his sound by merging live effects manipulation and drum triggers to craft
      intense, doom-laden dance soundscapes. His signature style is a fierce
      blend of rhythm and experimentation, designed to ignite sweat-drenched
      dance floors.
    photos_full_link: https://www.dropbox.com/scl/fo/3kyzkr6v9ykl4l99290yp/ABBMoybjnaHj15dEg--1dvw?rlkey=isp3t5260bb9q918gr8wwpw8s&dl=0
  - name: Nihiloxica
    bio_long: Treading a fine (and erratic) line between traditional Bugandan drum
      music, industrial post-punk, and club-ready rave music, Nihiloxica are a
      group like no other. It is the outcome of a collaboration between Ugandan
      drummers Henry Isabirye, Henry Kasoma, and Jamiru Mwanje, UK-based
      producer Pete Jones (pq), and the Amsterdam-based producer Jacob
      Maskell-Key (Spooky-J). Their self-titled debut EP released with Nyege
      Nyege Tapes in 2017 to widespread critical acclaim, leading to a debut
      performance as headliners at Nyege Nyege Festival that year. Guiding
      listeners into a trance, their more-than-techno sounds create hypnotic
      pathways into altered states. Dark techno ambience is ruptured by booming
      percussion, and traditional Engalabi and Bakisimba drums meld with
      synthesisers and electronics in Nihiloxica’s otherworldly music.
    photos_full_link: https://www.dropbox.com/scl/fo/pz43i4638d0zlnajo738c/AHeP4ewgjA2-ZBssI5DVPhY?rlkey=q8nuj98itsh4bbcd6nh6nv9hb&dl=0
