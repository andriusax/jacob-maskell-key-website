- title: World Press Photo - Opening Ceremony (2025)
  youtube_id: 1xmfzb-u-5k
  description: I made this video and its original score for the World Press Photo
    2025 exhibition ceremony. Working with such sensitive imagery was a real
    challenge. I aimed for something melancholic and somber, but engaging enough
    to hold attention on the stories these photographs tell.
  credits:
    - "Original Score: Jacob Maskell-Key"
    - "Video Edit: Jacob Maskell-Key"
