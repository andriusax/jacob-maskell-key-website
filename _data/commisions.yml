- title: World Press Photo - Opening Ceremony (2025)
  youtube_id: 1xmfzb-u-5k
  description: I made this video and its original score for the World Press Photo
    2025 exhibition ceremony. Working with such sensitive imagery was a real
    challenge. I aimed for something melancholic and somber, but engaging enough
    to hold attention on the stories these photographs tell.
  credits:
    - "Original Score: Jacob Maskell-Key"
    - "Video Edit: Jacob Maskell-Key"
- title: "Db x Marcelo Vieira: Create your own luck (2020)"
  youtube_id: EbLuGDMO_G0
  description: I composed this piece for Db in collaboration with Marcelo Vieira
    to accompany their latest campaign video. It grew out of an early call where
    Marcelo shared some rhythms and ideas that became the starting point for the
    track
  credits:
    - "Composition: Jacob Maskell-Key"
    - "Camera: Felipe Cantieri"
    - "Editor: Hugo Inglez"
- title: World Press Photo - Opening Ceremony (2026)
  youtube_id: 3Tq9HOrTDDI
  description: Video for the World Press Photo 2026 exhibition ceremony, set to
    the score I originally composed for 2025. New images, same music. It was
    striking how the piece took on a different meaning alongside this year’s
    stories.
  credits:
    - "Original Score: Jacob Maskell-Key"
    - "Video Edit: Jacob Maskell-Key"
