title: Jacob Maskell-Key
description: Composer, producer and member of Nihiloxica.
# baseurl is left blank so local dev (`jekyll serve`) still serves at the
# root (http://127.0.0.1:4000/) — the GitHub Actions workflow passes the
# correct project-page baseurl at build time instead (see .github/workflows/pages.yml)
baseurl: ""
url: "https://andriusax.github.io"

markdown: kramdown
permalink: pretty

collections:
  gigs:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
