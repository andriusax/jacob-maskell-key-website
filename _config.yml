title: Jacob Maskell-Key
description: Drummer, composer and producer. Makes electronic music as Spooky-J and plays in Nihiloxica.
logo: /assets/images/favicon.png
twitter:
  card: summary
# baseurl is left blank so local dev (`jekyll serve`) still serves at the
# root (http://127.0.0.1:4000/) — the GitHub Actions workflow passes the
# correct project-page baseurl at build time instead (see .github/workflows/pages.yml).
# Once on the custom domain, GitHub Pages serves from the root, so the
# workflow's base_path output resolves to "" automatically too.
baseurl: ""
url: "https://jacobmkey.work"

markdown: kramdown
permalink: pretty

collections:
  gigs:
    output: false

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      # Default preview image for link shares (WhatsApp, iMessage, Slack,
      # etc.) via jekyll-seo-tag's og:image / twitter:image. Override on a
      # specific page with its own `image:` front matter value if needed.
      image: /assets/images/favicon.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
